<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de compras</title>

  <style>
    .boton-carrito {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 22px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #7657e8, #5938c8);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 8px 18px #5938c844;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .boton-carrito:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px #5938c866;
    }

    .boton-carrito:active {
      transform: translateY(0);
    }

    .boton-carrito:focus-visible {
      outline: 3px solid #f4c95d;
      outline-offset: 4px;
    }

    .boton-carrito .flecha {
      font-size: 22px;
      transition: transform 0.2s ease;
    }

    .boton-carrito:hover .flecha {
      transform: translateX(4px);
    }
  </style>
</head>

<body>
  <header>
    <h1>Carrito de compras</h1>

    <nav aria-label="Navegación principal">
      <!-- Aquí puedes agregar enlaces del sitio -->
    </nav>
  </header>

  <main>
    <section aria-labelledby="productos-carrito">
      <h2 id="productos-carrito">Productos en tu carrito</h2>

      <article>
        <h3>Nombre del producto</h3>
        <p>Descripción del producto</p>
        <p>Precio: $0</p>

        <label for="cantidad-producto">Cantidad</label>
        <input
          id="cantidad-producto"
          name="cantidad"
          type="number"
          min="1"
          value="1"
        >

        <button type="button">Eliminar producto</button>
      </article>
    </section>

    <aside aria-labelledby="resumen-compra">
      <h2 id="resumen-compra">Resumen de compra</h2>
      <p>Subtotal: $0</p>
      <p>Total: $0</p>

      <button class="boton-carrito" type="button">
        <span>Continuar compra</span>
        <span class="flecha" aria-hidden="true">→</span>
      </button>
    </aside>
  </main>
</body>
</html>
