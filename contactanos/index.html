<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        
        <div class="row g-4 justify-content-center">
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border-0 h-100" id="card-contacto">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4 fw-bold">Contáctenos</h2>
                        <p class="text-center text-muted mb-4">¿Tienes alguna duda? Escríbenos y te responderemos lo antes posible.</p>

                        <form id="formularioContacto">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Pérez" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="mensaje" class="form-label">Mensaje</label>
                                <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
                            </div>
                            <div class="d-grid mt-auto">
                                <button type="submit" class="btn btn-primary btn-lg">Enviar mensaje</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border-0 h-100" id="card-Gestion">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4 fw-bold">Gestión de Solicitudes</h2>
                        <p class="text-center text-muted mb-4">Si tuviste alguna novedad con nuestros productos, háznoslo saber.</p>
                        <form id="formularioGestion">
                            <div class="mb-3">
                                <label for="idSolicitud" class="form-label">Fecha de la novedad</label>
                                <input type="date" class="form-control" id="idSolicitud" required>
                            </div>
                            <div class="mb-3">
                                <label for="estado" class="form-label">Tipo de novedad</label>
                                <select class="form-select" id="estado" required>
                                    <option value="" selected disabled>Selecciona un tipo...</option>
                                    <option value="pendiente">Queja</option>
                                    <option value="en_proceso">Reclamo</option>
                                    <option value="resuelta">Sugerencia</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label for="notas" class="form-label">Cuéntannos sobre tu experiencia</label>
                                <textarea class="form-control" id="notas" rows="4" placeholder="Agrega comentarios sobre el proceso..." required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">Enviar novedad</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="../js/validaciones.js"></script>
</body>
</html>
