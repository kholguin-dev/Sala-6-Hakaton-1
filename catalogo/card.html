<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <section id="producto" class="container h-auto" style="width: 300px;">
        <div class="card text-start">
            <div class="card-header" style="background-color: var(--amarillo-fuerte);">
                <h3>Nombre del producto</h3>
            </div>
            <div class="card-body" style="background-color: var(--amarillo-claro);">
                <img class="img-fluid rounded" src="https://www.stopjeans.com/cdn/shop/files/JEAN_RETROMOM_YY0000316_MEDIO_3.jpg?v=1785846852&width=250" alt="">
                <h5 class="card-title mt-2">COP $<span id="precio">150.000</span></h5>
                <p class="descripcion card-text">Descripcion.</p>
                <button href="#" class="btn btn-success fw-bold" style="background-color: var(--rojo); color:black">Agregar al carrito</button>
            </div>
            <div class="card-footer text-muted">
                Cantidad disponible: <span class="cantidad">12</span> uni.
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>

</html>
